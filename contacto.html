  let lang = localStorage.getItem('homeLang') || localStorage.getItem('aboutLang') || 'es';

  function sanitizeMessage(text) {
    return text
      .replace(/\u201c|\u201d|\u201e|\u201f/g, "'")
      .replace(/"/g, "'")
      .replace(/\\/g, ' ')
      .trim();
  }

  /* Textos de la página nueva. `reasons` no se toca: su etiqueta llega a Make. */
  Object.assign(t.es, {"h1": "Hablemos de su operación.", "intro": "Cuénteme cómo trabaja hoy su bodega. Le respondo personalmente.", "horario": "Lunes a viernes, de 9:00 a 18:00 (hora del Este). Miami, Florida.", "form_h2": "Escríbame", "form_sub": "Para una sesión de diagnóstico de PivetTrack, elija esa opción en el motivo.", "ph_msg": "Cuénteme qué necesita. Cuanto más detalle, mejor.", "reason_placeholder": "Elija una opción", "success_h3": "Mensaje recibido", "success_p": "Revise su bandeja de entrada: debería tener una respuesta esperándole.", "page_title": "Contacto | Raúl Pivet", "disclaimer": "Uso sus datos solo para responderle. <a href='privacidad.html'>Política de privacidad</a>.", "btn_send": "Enviar mensaje"});
  Object.assign(t.en, {"h1": "Let’s talk about your operation.", "intro": "Tell me how your warehouse works today. I answer personally.", "horario": "Monday to Friday, 9:00 a.m. to 6:00 p.m. Eastern. Miami, Florida.", "form_h2": "Write to me", "form_sub": "For a PivetTrack diagnostic session, pick that option as the reason.", "ph_msg": "Tell me what you need. The more detail, the better.", "success_h3": "Message received", "success_p": "Check your inbox: a reply should be waiting for you.", "page_title": "Contact | Raúl Pivet", "disclaimer": "I use your details only to reply to you. <a href='privacidad.html'>Privacy policy</a>.", "btn_send": "Send message"});

  function render() {
    const d = t[lang];
    document.title = d.page_title;
    document.getElementById('languageText').textContent = lang === 'es' ? 'English' : 'Español';
    const sinEmoji = s => s.replace(/^[\u{1F000}-\u{1FFFF}☀-⟿]\s*/u, '').trim();
    document.getElementById('mainContent').innerHTML = `
      <section class="contacto">
        <div class="marco contacto__rejilla">
          <div>
            <h1>${d.h1}</h1>
            <p class="grande">${d.intro}</p>
            <div class="contacto__datos">
              <a href="mailto:raul@raulpivet.com">raul@raulpivet.com</a>
              <a href="tel:+13055406846">+1 (305) 540 6846</a>
            </div>
            <p class="contacto__horario">${d.horario}</p>
          </div>
          <div class="hoja">
            <div id="formWrapper">
              <h2>${d.form_h2}</h2>
              <p class="hoja__sub">${d.form_sub}</p>
              <form id="contactForm" novalidate>
                <input type="text" id="hp_website" name="website" style="position:absolute;left:-9999px;opacity:0;height:0;width:0;" tabindex="-1" autocomplete="off" aria-hidden="true">
                <div class="campos">
                  <div class="campo"><label for="fname">${d.label_fname}</label><input type="text" id="fname" name="fname" autocomplete="given-name" required></div>
                  <div class="campo"><label for="lname">${d.label_lname}</label><input type="text" id="lname" name="lname" autocomplete="family-name"></div>
                  <div class="campo"><label for="company">${d.label_company}</label><input type="text" id="company" name="company" autocomplete="organization"></div>
                  <div class="campo"><label for="email">${d.label_email}</label><input type="email" id="email" name="email" autocomplete="email" required></div>
                  <div class="campo campo--ancho">
                    <label for="reason">${d.label_reason}</label>
                    <select id="reason" name="reason" autocomplete="off" required>
                      <option value="" disabled selected>${d.reason_placeholder}</option>
                      ${d.reasons.map(r=>`<option value="${r.value}">${sinEmoji(r.label)}</option>`).join('')}
                    </select>
                  </div>
                  <div class="campo campo--ancho"><label for="message">${d.label_msg}</label><textarea id="message" name="message" autocomplete="off" required placeholder="${d.ph_msg}"></textarea></div>
                </div>
                <button class="boton boton--oscuro btn-submit" id="submitBtn" type="submit"><span class="btn-text">${d.btn_send}</span><div class="btn-spinner"></div></button>
                <p class="hoja__aviso">${d.disclaimer}</p>
              </form>
            </div>
            <div class="success-screen" id="successScreen">
              <h3>${d.success_h3}</h3>
              <p>${d.success_p}</p>
            </div>
          </div>
        </div>
      </section>`;
    bindSubmit();
    const motivo = new URLSearchParams(location.search).get('motivo');
    const sel = document.getElementById('reason');
    if (motivo && Array.prototype.some.call(sel.options, o => o.value === motivo)) sel.value = motivo;
  }

  const MAKE_WEBHOOK_URL = 'https://hook.us2.make.com/ivr1wib3mxpgytpn8glao7e02a51lcdy';

  function bindSubmit() {
    const form        = document.getElementById('contactForm');
    const submitBtn   = document.getElementById('submitBtn');
    const formWrapper = document.getElementById('formWrapper');
    const successScreen = document.getElementById('successScreen');
    if (!form || !submitBtn) return;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      // Honeypot: si el campo oculto tiene contenido, es un bot
      if (document.getElementById('hp_website')?.value) return;
      const fname   = document.getElementById('fname').value.trim();
      const lname   = document.getElementById('lname').value.trim();
      const company = document.getElementById('company').value.trim();
      const email   = document.getElementById('email').value.trim();
      const reason  = document.getElementById('reason').value;
      const message = document.getElementById('message').value.trim();
      let valid = true;
      [['fname',fname],['email',email],['message',message]].forEach(([id,val]) => {
        const el = document.getElementById(id);
        if (!val) { el.style.borderColor='#FF3B30'; el.addEventListener('input',()=>el.style.borderColor='',{once:true}); valid=false; }
      });
      if (!reason) {
        const sel = document.getElementById('reason');
        sel.style.borderColor='#FF3B30'; sel.addEventListener('change',()=>sel.style.borderColor='',{once:true}); valid=false;
      }
      if (!valid) return;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        const el = document.getElementById('email'); el.style.borderColor='#FF3B30'; el.focus(); return;
      }
      submitBtn.classList.add('loading'); submitBtn.disabled = true;
      const d = t[lang];
      const reasonLabel = (d.reasons.find(r => r.value === reason) || {}).label || reason;
      const cleanReason = reasonLabel.replace(/^[\u{1F000}-\u{1FFFF}\u2600-\u27FF]\s*/u, '').trim();
      const cleanMessage = sanitizeMessage(message);
      try {
        await fetch(MAKE_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre:  `${fname} ${lname}`.trim(),
            empresa: company,
            email,
            motivo:  cleanReason,
            mensaje: cleanMessage,
            fecha:   new Date().toLocaleString('es-AR', { timeZone: 'America/New_York' })
          }),
          mode: 'no-cors'
        });
        formWrapper.style.opacity = '0';
        formWrapper.style.transform = 'translateY(-10px)';
        formWrapper.style.transition = 'all 0.3s ease';
        setTimeout(() => {
          formWrapper.style.display = 'none';
          successScreen.classList.add('visible');
        }, 300);
      } catch(err) {
        submitBtn.classList.remove('loading'); submitBtn.disabled = false;
        alert(lang === 'es' ? 'No se pudo enviar. Escríbame a raul@raulpivet.com' : 'Could not send. Please email raul@raulpivet.com');
      }
    });
  }

  function toggleLang() {
    lang = lang === 'es' ? 'en' : 'es';
    document.documentElement.lang = lang;
    localStorage.setItem('homeLang', lang);
    render();
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.documentElement.lang = lang;
    render();
    document.getElementById('languageToggle').addEventListener('click', toggleLang);
  });
  </script>
