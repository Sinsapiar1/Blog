    /* ── HERO ── */
    .about-hero {
      display: grid;
      grid-template-columns: 0.95fr 1.35fr;

      background:

      overflow: hidden;
      margin-bottom: 48px;

    .about-hero-img img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .about-hero-img-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to right, transparent 45%, var(--glass-bg) 98%);

    .about-hero-content {
      padding: 44px 40px 44px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .about-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,107,0,0.1); border: 1px solid rgba(255,107,0,0.25);
      color: #FF6B00; font-size: 11px; font-weight: 800; text-transform: uppercase;

      margin-bottom: 18px; width: fit-content;
    }
    .about-hero-content h1 {
      font-size: clamp(1.65rem, 3.2vw, 2.35rem);
      font-weight: 800; color: var(--text-primary);
      margin-bottom: 10px; letter-spacing: -0.03em; line-height: 1.15;
    }
    .about-hero-content h1 span {
      background: linear-gradient(135deg, #FF6B00, #FF9500);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .about-role {
      font-size: 0.9rem; font-weight: 600; color: #FF6B00;
      margin-bottom: 18px; line-height: 1.45;
    }
    .about-hero-content > p {
      font-size: 0.95rem; color: var(--text-secondary);
      line-height: 1.75; margin-bottom: 12px; max-width: 38rem;
    }
    .about-hero-content > p strong { color: var(--text-primary); }
    .about-hero-actions {
      display: flex; flex-wrap: wrap; gap: 12px;
      margin: 22px 0 18px;
    }
    .about-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .about-badge {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      padding: 6px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600; color: var(--text-secondary);
    }
    .about-badge i { color: #FF6B00; font-size: 11px; }

      .about-hero-img { min-height: 260px; max-height: 320px; }
      .about-hero-content { padding: 28px; }
      .about-hero-img-overlay {
        background: linear-gradient(to top, var(--glass-bg) 0%, transparent 55%);
      }
    }

    /* ── PULLQUOTE ── */
    .pullquote {
      background: linear-gradient(135deg, rgba(255,107,0,0.06), rgba(255,149,0,0.03));
      border-left: 4px solid #FF6B00;
      border-radius: 0 12px 12px 0;
      padding: 24px 28px;
      margin: 8px 0 48px;
    }
    .pullquote p {
      font-size: 1.08rem; font-style: italic;
      color: var(--text-primary); line-height: 1.7; margin: 0;
    }
    .pullquote cite {
      display: block; font-size: 0.8rem; color: var(--text-tertiary);
      margin-top: 10px; font-style: normal; font-weight: 600;
    }

    /* ── SECTION HEADERS ── */
    .section-eyebrow {
      font-size: 11px; font-weight: 800; color: #FF6B00;
      text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 8px;
    }
    .section-title {
      font-size: clamp(1.35rem, 2.5vw, 1.7rem);
      font-weight: 700; color: var(--text-primary);
      letter-spacing: -0.02em; margin-bottom: 10px; line-height: 1.25;
    }
    .section-lead {
      font-size: 0.95rem; color: var(--text-secondary);
      line-height: 1.7; max-width: 40rem; margin-bottom: 32px;
    }

    /* ── CAPABILITIES ── */
    .capabilities-section { margin: 8px 0 56px; }
    .cap-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-top: 1px solid var(--border-color);
    }
    .cap-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      align-items: start;
      padding: 26px 22px 26px 0;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.25s ease, padding-left 0.25s ease;
    }
    .cap-item:nth-child(odd) { padding-right: 28px; }
    .cap-item:nth-child(even) { padding-left: 28px; border-left: 1px solid var(--border-color); }
    .cap-item:hover { background: rgba(255,107,0,0.03); }
    .cap-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, rgba(255,107,0,0.16), rgba(255,149,0,0.06));
      color: #FF6B00; font-size: 1.1rem; flex-shrink: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .cap-item:hover .cap-icon {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255,107,0,0.18);
    }
    .cap-body h3 {
      font-size: 1rem; font-weight: 700; color: var(--text-primary);
      margin-bottom: 6px; letter-spacing: -0.01em;
    }
    .cap-body p {
      font-size: 0.875rem; color: var(--text-secondary); line-height: 1.65; margin: 0;
    }
    .cap-formats {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
    }
    .cap-format {
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      color: #FF6B00; background: rgba(255,107,0,0.08);
      border: 1px solid rgba(255,107,0,0.18);
      padding: 3px 8px; border-radius: 6px;
    }
    @media (max-width: 800px) {
      .cap-list { grid-template-columns: 1fr; }
      .cap-item:nth-child(odd),
      .cap-item:nth-child(even) {
        padding-left: 0; padding-right: 0; border-left: none;
      }
    }

    /* ── BEFORE / AFTER ── */
    .contrast-section { margin: 8px 0 56px; }
    .contrast-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      position: relative;
    }
    .contrast-panel {
      border-radius: 18px;
      padding: 28px 26px;
      position: relative;
      overflow: hidden;
    }
    .contrast-panel--before {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-color);
    }
    .contrast-panel--after {
      background:
        linear-gradient(160deg, rgba(255,107,0,0.12), rgba(255,149,0,0.04) 55%, transparent);
      border: 1px solid rgba(255,107,0,0.28);
    }
    .contrast-label {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.14em; margin-bottom: 16px;
    }
    .contrast-panel--before .contrast-label { color: var(--text-tertiary); }
    .contrast-panel--after .contrast-label { color: #FF6B00; }
    .contrast-panel h3 {
      font-size: 1.15rem; font-weight: 700; color: var(--text-primary);
      margin-bottom: 18px; letter-spacing: -0.02em; line-height: 1.3;
    }
    .contrast-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
    .contrast-list li {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 0.875rem; line-height: 1.55; color: var(--text-secondary);
    }
    .contrast-list li i { margin-top: 3px; flex-shrink: 0; font-size: 0.85rem; }
    .contrast-panel--before .contrast-list li i { color: #FF453A; }
    .contrast-panel--after .contrast-list li i { color: #34C759; }
    @media (max-width: 800px) {
      .contrast-grid { grid-template-columns: 1fr; }
    }

    /* ── VALUE / METHOD ── */
    .values-section { margin: 8px 0 56px; }
    .values-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
    .value-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      padding: 22px 0;
      border-bottom: 1px solid var(--border-color);
      transition: opacity 0.25s ease;
    }
    .value-row:nth-child(-n+2) { border-top: 1px solid var(--border-color); }
    .value-num {
      font-size: 1.6rem; font-weight: 800; color: rgba(255,107,0,0.35);
      line-height: 1; letter-spacing: -1px; min-width: 2.2rem;

    .value-row h3 {
      font-size: 0.98rem; font-weight: 700; color: var(--text-primary);
      margin-bottom: 6px; line-height: 1.3;
    }
    .value-guarantee {
      display: inline-block; font-size: 10px; font-weight: 800;
      color: #FF6B00; text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 8px;

    .value-row p {
      font-size: 0.85rem; color: var(--text-secondary); line-height: 1.65; margin: 0;
    }
    @media (max-width: 800px) {
      .values-grid { grid-template-columns: 1fr; }
      .value-row:nth-child(-n+2) { border-top: none; }
      .value-row:first-child { border-top: 1px solid var(--border-color); }
    }

    /* ── CREDIBILITY ── */
    .credibility {
      margin: 8px 0 40px;
      padding: 22px 26px;
      border-radius: 16px;
      border: 1px solid rgba(255,107,0,0.18);
      background: linear-gradient(90deg, rgba(255,107,0,0.07), transparent 70%);
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 14px;
    }
    .credibility p {
      margin: 0; font-size: 0.9rem; color: var(--text-secondary); line-height: 1.55;
      max-width: 42rem;

    .credibility p strong { color: var(--text-primary); }
    .credibility-link {
      font-size: 0.85rem; font-weight: 700; color: #FF6B00;
      text-decoration: none; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
      transition: opacity 0.2s;

    .credibility-link:hover { opacity: 0.8; }

    /* ── CTA ── */
    .about-cta {
      margin: 24px 0 48px;
      background:

      margin-bottom: 10px; letter-spacing: -0.02em;
    }
    .about-cta p { color: var(--text-secondary); margin-bottom: 24px; line-height: 1.65; max-width: 34rem; margin-left: auto; margin-right: auto; }
    .btn-outline {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border: 2px solid var(--border-color);
      border-radius: 50px; color: var(--text-primary);
      font-weight: 600; font-size: 14px; text-decoration: none;
      transition: all 0.2s; background: transparent;
    }
    .btn-outline:hover { border-color: #FF6B00; color: #FF6B00; }
