    }
    .about-hero-content h1 span {
      background: linear-gradient(135deg, #FF6B00, #FF9500);

      font-size: 0.9rem; font-weight: 600; color: #FF6B00;
      margin-bottom: 18px; line-height: 1.45;

    .about-hero-content > p {
      font-size: 0.95rem; color: var(--text-secondary);
      line-height: 1.75; margin-bottom: 12px; max-width: 38rem;
    }
    .about-hero-content > p strong { color: var(--text-primary); }
    .about-hero-actions {
      display: flex; flex-wrap: wrap; gap: 12px;

    .about-badge {
      display: flex; align-items: center; gap: 6px;

    .pullquote {
      background: linear-gradient(135deg, rgba(255,107,0,0.06), rgba(255,149,0,0.03));
      border-left: 4px solid #FF6B00;
      border-radius: 0 12px 12px 0;
      padding: 24px 28px;
      margin: 8px 0 48px;
    }
    .pullquote p {
      font-size: 1.08rem; font-style: italic;
      color: var(--text-primary); line-height: 1.7; margin: 0;
    }
    .pullquote cite {
      display: block; font-size: 0.8rem; color: var(--text-tertiary);
      margin-top: 10px; font-style: normal; font-weight: 600;
    }

    .section-eyebrow {
      font-size: 11px; font-weight: 800; color: #FF6B00;
      text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 8px;
    }
    .section-title {
      font-size: clamp(1.35rem, 2.5vw, 1.7rem);
      font-weight: 700; color: var(--text-primary);
      letter-spacing: -0.02em; margin-bottom: 10px; line-height: 1.25;
    }
    .section-lead {
      font-size: 0.95rem; color: var(--text-secondary);
      line-height: 1.7; max-width: 40rem; margin-bottom: 32px;
    }

    /* ── CAPABILITIES ── */
    .capabilities-section { margin: 8px 0 56px; }
    .cap-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-top: 1px solid var(--border-color);
    }
    .cap-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      align-items: start;
      padding: 26px 22px 26px 0;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.25s ease, padding-left 0.25s ease;
    }
    .cap-item:nth-child(odd) { padding-right: 28px; }
    .cap-item:nth-child(even) { padding-left: 28px; border-left: 1px solid var(--border-color); }
    .cap-item:hover { background: rgba(255,107,0,0.03); }
    .cap-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, rgba(255,107,0,0.16), rgba(255,149,0,0.06));
      color: #FF6B00; font-size: 1.1rem; flex-shrink: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .cap-item:hover .cap-icon {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255,107,0,0.18);
    }
    .cap-body h3 {
      font-size: 1rem; font-weight: 700; color: var(--text-primary);
      margin-bottom: 6px; letter-spacing: -0.01em;
    }
    .cap-body p {
      font-size: 0.875rem; color: var(--text-secondary); line-height: 1.65; margin: 0;
    }
    .cap-formats {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
    }
    .cap-format {
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      color: #FF6B00; background: rgba(255,107,0,0.08);
      border: 1px solid rgba(255,107,0,0.18);
      padding: 3px 8px; border-radius: 6px;
    }
    @media (max-width: 800px) {
      .cap-list { grid-template-columns: 1fr; }
      .cap-item:nth-child(odd),
      .cap-item:nth-child(even) {
        padding-left: 0; padding-right: 0; border-left: none;
      }
    }

    /* ── BEFORE / AFTER ── */
    .contrast-section { margin: 8px 0 56px; }
    .contrast-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      position: relative;
    }
    .contrast-panel {
      border-radius: 18px;
      padding: 28px 26px;
      position: relative;
      overflow: hidden;
    }
    .contrast-panel--before {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border-color);
    }
    .contrast-panel--after {
      background:
        linear-gradient(160deg, rgba(255,107,0,0.12), rgba(255,149,0,0.04) 55%, transparent);
      border: 1px solid rgba(255,107,0,0.28);

    .contrast-label {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.14em; margin-bottom: 16px;
    }
    .contrast-panel--before .contrast-label { color: var(--text-tertiary); }
    .contrast-panel--after .contrast-label { color: #FF6B00; }
    .contrast-panel h3 {
      font-size: 1.15rem; font-weight: 700; color: var(--text-primary);
      margin-bottom: 18px; letter-spacing: -0.02em; line-height: 1.3;
    }
    .contrast-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }

      font-size: 0.875rem; line-height: 1.55; color: var(--text-secondary);
    }
    .contrast-list li i { margin-top: 3px; flex-shrink: 0; font-size: 0.85rem; }
    .contrast-panel--before .contrast-list li i { color: #FF453A; }
    .contrast-panel--after .contrast-list li i { color: #34C759; }
    @media (max-width: 800px) {
      .contrast-grid { grid-template-columns: 1fr; }
    }

    /* ── VALUE / METHOD ── */
    .values-section { margin: 8px 0 56px; }
    .values-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
    .value-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      padding: 22px 0;
      border-bottom: 1px solid var(--border-color);
      transition: opacity 0.25s ease;

    .value-row:nth-child(-n+2) { border-top: 1px solid var(--border-color); }
    .value-num {

    .btn-outline {

      padding: 12px 24px; border: 2px solid var(--border-color);

      font-weight: 600; font-size: 14px; text-decoration: none;
      transition: all 0.2s; background: transparent;
    }
    .btn-outline:hover { border-color: #FF6B00; color: #FF6B00; }

    document.getElementById('sidebarSubtitle').textContent = d.sidebar;
    document.getElementById('footerText').textContent = d.footer;
    document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (d[k]) el.textContent = d[k]; });
    document.getElementById('languageFlag').textContent = lang === 'es' ? '🇺🇸' : '🇪🇸';
    document.getElementById('languageText').textContent = lang === 'es' ? 'English' : 'Español';

    document.getElementById('mainContent').innerHTML = `
      <section class="about-hero" data-aos="fade-up">

          <p class="about-role">${d.role}</p>
          <p>${d.p1}</p>
          <p>${d.p2}</p>
          <div class="about-hero-actions">
            <a href="pivettrack.html" class="btn"><i class="fas fa-warehouse"></i> ${d.cta_hero1}</a>
            <a href="contacto.html" class="btn-outline"><i class="fas fa-calendar-check"></i> ${d.cta_hero2}</a>
          </div>
          <div class="about-badges">${d.badges.map(b=>`<span class="about-badge"><i class="${b.icon}"></i>${b.text}</span>`).join('')}</div>

      </section>

      <div class="pullquote" data-aos="fade-up"><p>"${d.quote}"</p><cite>${d.quote_cite}</cite></div>

        <h2 class="section-title">${d.cap_title}</h2>
        <p class="section-lead">${d.cap_lead}</p>
        <div class="cap-list">
          ${d.capabilities.map((c,i)=>`
            <article class="cap-item" data-aos="fade-up" data-aos-delay="${i*50}">
              <div class="cap-icon"><i class="${c.icon}"></i></div>
              <div class="cap-body">
                <h3>${c.title}</h3>
                <p>${c.desc}</p>
                ${c.formats ? `<div class="cap-formats">${c.formats.map(f=>`<span class="cap-format">${f}</span>`).join('')}</div>` : ''}

            </article>`).join('')}
        </div>
      </section>

      <section class="contrast-section" data-aos="fade-up">

        <h2 class="section-title">${d.contrast_title}</h2>
        <p class="section-lead">${d.contrast_lead}</p>
        <div class="contrast-grid">
          <div class="contrast-panel contrast-panel--before" data-aos="fade-right">

            <h3>${d.after_title}</h3>
            <ul class="contrast-list">
              ${d.after.map(item=>`<li><i class="fas fa-check"></i><span>${item}</span></li>`).join('')}
            </ul>
          </div>
        </div>
      </section>

        <p class="section-eyebrow">${d.values_eyebrow}</p>
        <h2 class="section-title">${d.values_title}</h2>
        <p class="section-lead">${d.values_lead}</p>
        <div class="values-grid">
          ${d.values.map((v,i)=>`
            <div class="value-row" data-aos="fade-up" data-aos-delay="${i*60}">
              <div class="value-num">${v.num}</div>
              <div>
                <span class="value-guarantee">${v.guarantee}</span>
                <h3>${v.title}</h3>
                <p>${v.desc}</p>
              </div>
            </div>`).join('')}
        </div>
      </section>

      <div class="credibility" data-aos="fade-up">
        <p>${d.cred_text}</p>

          <a href="pivettrack.html" class="btn"><i class="fas fa-warehouse"></i> ${d.cta_btn1}</a>
          <a href="contacto.html" class="btn-outline"><i class="fas fa-calendar-check"></i> ${d.cta_btn2}</a>
        </div>
      </section>`;

    refreshAOS();
  }

  function toggleLang() {
    lang = lang === 'es' ? 'en' : 'es';
    document.documentElement.lang = lang;
    localStorage.setItem('aboutLang', lang);
    localStorage.setItem('homeLang', lang);
    render();
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.documentElement.lang = lang;
    render();
    document.getElementById('languageToggle').addEventListener('click', toggleLang);
  });
  </script>
