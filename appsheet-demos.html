    /* ══════════════════════════════════════════
       MODAL "¿QUÉ ES APPSHEET?"
    ══════════════════════════════════════════ */
    #appsheetInfoModal { display:none; position:fixed; inset:0; z-index:5001; align-items:center; justify-content:center; }
    #appsheetInfoModal.modal-open { display:flex; }
    .modal-overlay { position:absolute; inset:0; background:rgba(0,0,0,0); backdrop-filter:blur(0px); transition:background 0.4s ease, backdrop-filter 0.4s ease; cursor:pointer; }

    #appsheetInfoModal.modal-open .modal-content-wrapper { opacity:1; transform:scale(1); }

    .modal-close-btn:hover { background:rgba(255,59,48,0.9); transform:scale(1.12); }
    .modal-header { text-align:center; margin-bottom:32px; }

    .modal-feature-icon { width:40px; height:40px; background:linear-gradient(135deg, rgba(255,107,0,0.15), rgba(255,149,0,0.08)); border-radius:10px; display:flex; align-items:center; justify-content:center; color:#FF6B00; font-size:1.1rem; margin-bottom:12px; }

    /* ══════════════════════════════════════════

    ══════════════════════════════════════════ */
    .archive-strip { display:flex; align-items:flex-start; gap:16px; margin:0 0 32px; padding:18px 22px; background:rgba(255,107,0,0.08); border:1px solid rgba(255,107,0,0.3); border-left:4px solid #FF6B00; border-radius:var(--radius-lg, 14px); }

    .demos-eyebrow-sub { font-size: 0.875rem; font-weight: 600; color: var(--text-secondary); }
    .demos-hero h1 { font-size:clamp(1.9rem,4vw,2.8rem); font-weight:800; line-height:1.15; letter-spacing:-0.03em; color:var(--text-primary); margin-bottom:16px; }
    .demos-hero h1 span { background:linear-gradient(135deg,#FF6B00,#FF9500); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .demos-hero-sub { font-size:1.05rem; color:var(--text-secondary); line-height:1.7; max-width:560px; margin-bottom:28px; }

    .demos-hero-tag:hover { border-color:#FF6B00; color:#FF6B00; }

    /* ══════════════════════════════════════════ STATS ══════════════════════════════════════════ */
    .demos-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 0 0 48px; }
    @media(max-width:640px){ .demos-stats { grid-template-columns: 1fr; } }
    @media(max-width:900px) and (min-width:641px){ .demos-stats { grid-template-columns: repeat(3,1fr); } }
    .demos-stat { background: var(--glass-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px 20px 20px; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: all 0.3s cubic-bezier(0.34,1.3,0.64,1); }
    .demos-stat::before { content: attr(data-ghost); position: absolute; right: -8px; bottom: -14px; font-size: 4.5rem; font-weight: 900; color: rgba(255,107,0,0.05); line-height: 1; pointer-events: none; transition: color 0.3s; }
    .demos-stat:hover { border-color:rgba(255,107,0,0.4); transform:translateY(-6px); box-shadow:0 16px 40px rgba(255,107,0,0.15); }

    .demos-stat-bar { position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,#FF6B00,#FF9500); transform:scaleX(0); transform-origin:left; transition:transform 0.4s ease; border-radius:20px 20px 0 0; }
    .demos-stat:hover .demos-stat-bar { transform:scaleX(1); }
    .demos-stat-icon-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .demos-stat-icon { width:40px; height:40px; background:linear-gradient(135deg,rgba(255,107,0,0.18),rgba(255,149,0,0.08)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1rem; color:#FF6B00; border:1px solid rgba(255,107,0,0.15); }
    .demos-stat-trend { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:0.1em; color:#34C759; background:rgba(52,199,89,0.1); border:1px solid rgba(52,199,89,0.2); padding:3px 8px; border-radius:10px; }
    .demos-stat-number { font-size:2.2rem; font-weight:900; color:#FF6B00; line-height:1; letter-spacing:-0.03em; margin-bottom:6px; }
    .demos-stat-label { font-size:0.8125rem; font-weight:700; color:var(--text-primary); line-height:1.3; margin-bottom:4px; }
    .demos-stat-sub { font-size:11px; color:var(--text-tertiary); line-height:1.4; font-style:italic; }

    /* ══════════════════════════════════════════ INTRO CARD ══════════════════════════════════════════ */
    .demos-intro-card { background: var(--glass-bg); border: 1px solid var(--border-color); border-radius: 20px; overflow: hidden; position: relative; margin-bottom: 48px; }

    .demos-intro-left { padding: 36px 40px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; }
    @media(max-width:800px){ .demos-intro-left { border-right:none; border-bottom:1px solid var(--border-color); } }
    .demos-intro-eyebrow { display:inline-flex; align-items:center; gap:8px; background:rgba(255,107,0,0.1); border:1px solid rgba(255,107,0,0.25); color:#FF6B00; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.12em; padding:5px 12px; border-radius:20px; margin-bottom:18px; width:fit-content; }
    .demos-intro-left h2 { font-size:clamp(1.2rem,2vw,1.55rem); font-weight:800; color:var(--text-primary); line-height:1.25; letter-spacing:-0.02em; margin-bottom:14px; }
    .demos-intro-left h2 span { background:linear-gradient(135deg,#FF6B00,#FF9500); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .demos-intro-left p { font-size:0.9375rem; color:var(--text-secondary); line-height:1.75; margin-bottom:20px; }
    .demos-proof { display:inline-flex; align-items:center; gap:8px; background:rgba(52,199,89,0.08); border:1px solid rgba(52,199,89,0.2); border-radius:10px; padding:10px 14px; font-size:0.8125rem; color:var(--text-secondary); line-height:1.5; }
    .demos-proof i { color:#34C759; font-size:1rem; flex-shrink:0; }
    .demos-proof strong { color:var(--text-primary); }
    .demos-intro-right { padding: 36px 40px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
    .demos-feature { display: flex; align-items: flex-start; gap: 14px; background: var(--bg-secondary); border:1px solid var(--border-color); border-radius: 14px; padding: 16px 18px; transition: border-color 0.2s, transform 0.2s; }
    .demos-feature:hover { border-color:rgba(255,107,0,0.3); transform:translateX(4px); }
    .demos-feature-icon { width:32px; height:32px; flex-shrink:0; background:linear-gradient(135deg,#FF6B00,#FF9500); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:0.8rem; color:white; }
    .demos-feature-title { font-size:0.875rem; font-weight:700; color:var(--text-primary); margin-bottom:3px; }
    .demos-feature-desc { font-size:0.8rem; color:var(--text-secondary); line-height:1.55; }

    /* ══════════════════════════════════════════ VIDEO GRID ══════════════════════════════════════════ */
    .demos-section-header { margin-bottom:28px; }
    .demos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 28px; margin-bottom: 56px; }
    @media(max-width:480px){ .demos-grid { grid-template-columns:1fr; } }
    .demo-card { background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-border); border-radius: var(--radius-xl); overflow: hidden; transition: all var(--transition-base); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; position: relative; cursor: pointer; }
    .demo-card::before { content: ''; position: absolute; top:0; left:0; right:0; height:3px; background: linear-gradient(90deg,#FF6B00,#FF9500); transform: scaleX(0); transform-origin: left; transition: transform 0.4s ease; border-radius: var(--radius-xl) var(--radius-xl) 0 0; z-index: 1; }
    .demo-card:hover::before { transform: scaleX(1); }
    .demo-card:hover { transform: translateY(-8px); box-shadow: 0 24px 56px rgba(255,107,0,0.16); border-color: rgba(255,107,0,0.3); }

    .demo-video-wrap iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; pointer-events: none; }
    .demo-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0); display: flex; align-items: center; justify-content: center; opacity: 0; transition: all var(--transition-base); z-index: 2; }

    .demo-overlay-btn:hover { transform: scale(1.08); box-shadow: 0 12px 32px rgba(255,107,0,0.6); }
    .demo-card-body { padding: 22px 24px 24px; flex:1; display:flex; flex-direction:column; }
    .demo-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
    .demo-tag { font-size:0.7rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:3px 10px; border-radius:var(--radius-full); background:rgba(255,107,0,0.08); color:#FF6B00; border:1px solid rgba(255,107,0,0.2); }
    .demo-card-body h3 { font-size:1.15rem; font-weight:700; color:var(--text-primary); margin-bottom:8px; letter-spacing:-0.01em; }
    .demo-card-body p { font-size:0.875rem; color:var(--text-secondary); line-height:1.65; flex:1; margin-bottom:16px; }
    .demo-card-footer { display:flex; align-items:center; justify-content:space-between; padding-top:14px; border-top:1px solid var(--border-color); margin-top:auto; }
    .demo-status { display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--text-secondary); font-weight:500; }

    /* ══════════════════════════════════════════ CTA FINAL ══════════════════════════════════════════ */
    .demos-cta { margin: 8px 0 48px; background: linear-gradient(135deg,rgba(255,107,0,0.08),rgba(255,149,0,0.04)); border: 1px solid rgba(255,107,0,0.2); border-radius: 20px; padding: 48px 40px; text-align: center; }

    .demos-cta p { color:var(--text-secondary); margin-bottom:32px; font-size:1rem; line-height:1.6; max-width:520px; margin-left:auto; margin-right:auto; }
    .demos-cta-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    @media(max-width:480px){ .demos-cta { padding:32px 24px; } .demos-cta-btns { flex-direction:column; align-items:center; } }

    /* ══════════════════════════════════════════════════════════════════════════
       LIGHTBOX — ARQUITECTURA FLEX RESPONSIVA DINÁMICA
       Funciona en TODOS los dispositivos sin hardcodear alturas.
       El carrusel se adapta al espacio disponible automáticamente.
    ══════════════════════════════════════════════════════════════════════════ */

    #demoLightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5000;
      align-items: center;
      justify-content: center;
      padding: clamp(8px, 2vw, 24px);
      box-sizing: border-box;
    }
    #demoLightbox.lb-open { display: flex; }

    .lb-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      backdrop-filter: blur(0px);
      transition: background 0.4s ease, backdrop-filter 0.4s ease;
      cursor: pointer;
    }
    #demoLightbox.lb-open .lb-overlay {
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(14px);
    }

    /* Contenedor principal: FLEX COLUMN con altura controlada */
    .lb-box {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1200px;
      height: 100%;
      max-height: 100vh;
      max-height: 100dvh; /* dynamic viewport height - evita problemas con barra de nav mobile */
      opacity: 0;
      transform: scale(0.93);
      transition: opacity 0.35s cubic-bezier(0.16,1,0.3,1), transform 0.35s cubic-bezier(0.16,1,0.3,1);
      gap: 16px;
    }
    #demoLightbox.lb-open .lb-box {
      opacity: 1;
      transform: scale(1);
    }

    /* Frame con la barra de navegador + carrusel.
       flex: 1 = toma todo el espacio disponible después del .lb-info */
    .lb-frame-wrap {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0; /* ← CRÍTICO: permite que el frame respete el tamaño flex */
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7);
      background: #0a0a0a;
    }

    .lb-browser-bar {
      flex-shrink: 0;
      background: #1e1e1e;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .lb-browser-dots { display:flex; gap:6px; flex-shrink: 0; }
    .lb-browser-dots span { width:11px; height:11px; border-radius:50%; }
    .lb-browser-dots span:nth-child(1){background:#FF5F56}
    .lb-browser-dots span:nth-child(2){background:#FFBD2E}
    .lb-browser-dots span:nth-child(3){background:#27C93F}
    .lb-url-bar { flex:1; background:rgba(255,255,255,0.08); border-radius:6px; padding:5px 12px; font-size:0.75rem; color:rgba(255,255,255,0.6); font-family:monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ─── CARRUSEL ─── */
    .lb-carousel-wrap {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0; /* idem, crítico */
      background: #000;
      overflow: hidden;
    }

    .lb-carousel-inner {
      display: flex;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      height: 100%;
      width: 100%;
      touch-action: pan-y pinch-zoom; /* permite scroll vertical de la página y zoom, pero no interfiere con swipe horizontal */
    }

    .lb-carousel-slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      box-sizing: border-box;
    }

    /* Slide con IMAGEN: padding generoso para que no toque bordes ni flechas */
    .lb-carousel-slide--image {
      padding: clamp(20px, 4vw, 48px) clamp(56px, 8vw, 88px);
    }
    .lb-carousel-slide--image img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    /* Slide con VIDEO: sin padding, ocupa todo el espacio en 16:9 */
    .lb-carousel-slide--video {
      padding: 0;
    }
    .lb-carousel-slide--video .lb-video-holder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .lb-carousel-slide--video iframe {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      display: block;
    }

    /* Flechas de navegación: posicionadas dentro del carrusel pero con padding para NO solapar la imagen */
    .lb-carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: clamp(36px, 5vw, 48px);
      height: clamp(36px, 5vw, 48px);
      background: rgba(20,20,20,0.75);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      color: white;
      font-size: clamp(0.85rem, 1.5vw, 1.1rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      z-index: 10;
      padding: 0;
    }
    .lb-carousel-arrow:hover:not(:disabled) {
      background: rgba(255,107,0,0.85);
      border-color: #FF6B00;
      transform: translateY(-50%) scale(1.08);
    }
    .lb-carousel-arrow.lb-prev { left: clamp(8px, 1.5vw, 16px); }
    .lb-carousel-arrow.lb-next { right: clamp(8px, 1.5vw, 16px); }
    .lb-carousel-arrow:disabled { opacity: 0.25; cursor: default; }

    /* Indicadores (dots) - flotantes abajo */
    .lb-carousel-indicators {
      position: absolute;
      bottom: clamp(10px, 2vw, 18px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 7px;
      background: rgba(0,0,0,0.6);
      padding: 7px 13px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 10;
      max-width: calc(100% - 120px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .lb-carousel-indicators::-webkit-scrollbar { display: none; }
    .lb-carousel-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      border: none;
      cursor: pointer;
      transition: all var(--transition-fast);
      padding: 0;
      flex-shrink: 0;
    }
    .lb-carousel-dot.active {
      background: #FF6B00;
      transform: scale(1.5);
    }

    /* Contador de slide (ej: "3 / 7") - mejora UX cuando hay muchas imágenes */
    .lb-slide-counter {
      position: absolute;
      top: clamp(8px, 1.5vw, 14px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: rgba(255,255,255,0.85);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      font-family: monospace;
      z-index: 10;
      letter-spacing: 0.05em;
    }

    /* Botón cerrar — flotante fuera del frame */
    .lb-close {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 38px;
      height: 38px;
      background: rgba(20,20,20,0.95);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.2s;
      z-index: 25;
      padding: 0;
    }
    .lb-close:hover { background: rgba(255,59,48,0.9); transform: scale(1.1); }

    /* Info inferior: título + descripción + botones */
    .lb-info {
      flex-shrink: 0;
      color: white;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 0 4px;
      max-height: 40%; /* nunca más del 40% del viewport */
    }
    .lb-info-text {
      flex: 1;
      min-width: 0; /* permite que el texto trunque sin desbordar */
    }
    .lb-info-text h3 {
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      font-weight: 700;
      margin: 0 0 6px;
      text-align: left;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .lb-info-text p {
      font-size: clamp(0.82rem, 1.5vw, 0.92rem);
      opacity: 0.78;
      text-align: left;
      line-height: 1.55;
      margin: 0;
      white-space: pre-line; /* respeta los \n de las descripciones */
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* "Leer más" — truncado a 3 líneas en mobile, completo en desktop */
    .lb-info-text.collapsed p {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .lb-info-text.expanded p {
      max-height: 25vh;
      overflow-y: auto;
      padding-right: 6px;
    }
    .lb-info-text.expanded p::-webkit-scrollbar { width: 4px; }
    .lb-info-text.expanded p::-webkit-scrollbar-thumb { background: rgba(255,107,0,0.5); border-radius: 2px; }

    .lb-read-more {
      display: none; /* se muestra solo en mobile via @media */
      background: transparent;
      border: none;
      color: #FF9500;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 6px 0 0;
      cursor: pointer;
      text-align: left;
    }
    .lb-read-more:hover { color: #FF6B00; text-decoration: underline; }

    .lb-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      align-items: center;
    }
    .lb-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border: none;
      border-radius: var(--radius-full);
      font-size: clamp(0.82rem, 1.5vw, 0.9rem);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
      text-decoration: none;
      box-sizing: border-box;
    }
    .lb-action-btn.primary {
      background: linear-gradient(135deg,#FF6B00,#FF9500);
      color: white;
      box-shadow: 0 4px 16px rgba(255,107,0,0.45);
    }
    .lb-action-btn.primary:hover { transform:translateY(-2px); box-shadow: 0 8px 28px rgba(255,107,0,0.6); }
    .lb-action-btn.secondary {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .lb-action-btn.secondary:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }

    /* ═══════════════════════════════════════════════════════
       TABLET (≤900px): Info se reorganiza vertical
    ═══════════════════════════════════════════════════════ */
    @media(max-width: 900px) {
      .lb-info {
        flex-direction: column;
        gap: 14px;
        max-height: 45%;
      }
      .lb-actions {
        width: 100%;
        justify-content: flex-start;
      }
    }

    /* ═══════════════════════════════════════════════════════
       MOBILE (≤640px): Layout optimizado
    ═══════════════════════════════════════════════════════ */
    @media(max-width: 640px) {
      #demoLightbox {
        padding: 8px;
      }
      .lb-box {
        gap: 10px;
      }
      .lb-browser-bar {
        padding: 8px 12px;
        gap: 8px;
      }
      .lb-browser-dots span { width: 9px; height: 9px; }
      .lb-url-bar { font-size: 0.7rem; padding: 4px 10px; }

      .lb-close {
        top: 2px;
        right: 2px;
        width: 34px;
        height: 34px;
        font-size: 0.8rem;
      }

      /* Flechas más juntas al borde en mobile */
      .lb-carousel-arrow.lb-prev { left: 6px; }
      .lb-carousel-arrow.lb-next { right: 6px; }

      /* En mobile, las imágenes pueden ocupar más espacio (menos padding lateral) */
      .lb-carousel-slide--image {
        padding: 14px 48px;
      }

      .lb-info {
        gap: 10px;
        max-height: 50%;
      }
      .lb-info-text h3 {
        font-size: 1rem;
        margin-bottom: 4px;
      }
      .lb-info-text p {
        font-size: 0.82rem;
        line-height: 1.5;
      }

      /* "Leer más" aparece solo en mobile */
      .lb-read-more { display: inline-block; }

      .lb-actions {
        width: 100%;
        gap: 8px;
      }
      .lb-action-btn {
        flex: 1;
        justify-content: center;
        padding: 10px 14px;
        font-size: 0.82rem;
      }

      .lb-slide-counter {
        font-size: 0.7rem;
        padding: 3px 10px;
      }

      .lb-carousel-indicators {
        padding: 5px 10px;
        gap: 6px;
        bottom: 10px;
      }
      .lb-carousel-dot { width: 6px; height: 6px; }
    }

    /* ═══════════════════════════════════════════════════════
       MOBILE EXTRA-SMALL (≤380px): iPhone SE y similares
    ═══════════════════════════════════════════════════════ */
    @media(max-width: 380px) {
      .lb-actions { flex-direction: column; }
      .lb-action-btn { width: 100%; }
      .lb-carousel-slide--image { padding: 10px 42px; }
    }

    /* ═══════════════════════════════════════════════════════
       LANDSCAPE MOBILE (altura baja): prioridad al carrusel
    ═══════════════════════════════════════════════════════ */
    @media(max-height: 500px) and (orientation: landscape) {
      .lb-info {
        max-height: 35%;
        flex-direction: row;
      }
      .lb-info-text p {
        font-size: 0.78rem;
        -webkit-line-clamp: 2;
        line-clamp: 2;
      }
      .lb-actions { flex-direction: row; width: auto; }
      .lb-action-btn { flex: 0 0 auto; }
    }
  </style>
</head>

  // ══════════════════════════════════════════════════════════════════════
  // SISTEMA DE RENDERING DINÁMICO
  // ══════════════════════════════════════════════════════════════════════
  let lang = localStorage.getItem('homeLang') || 'es';
  let currentCarouselIndex = 0;
  let currentSlidesCount = 0;
  let currentDemoData = null;

  function buildVideoCard(v, d, idx) {
    return `
      <article class="demo-card" data-demo-idx="${idx}" data-aos="fade-up" data-aos-delay="${100 + idx * 80}">
        <div class="demo-video-wrap">
          <iframe src="https://www.youtube.com/embed/${v.id}?rel=0&modestbranding=1" title="${v.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>
          <div class="demo-overlay">
            <button class="demo-overlay-btn"><i class="fas fa-search-plus"></i> ${d.view_details}</button>
          </div>
        </div>
        <div class="demo-card-body">
          <div class="demo-tags">${v.tags.map(t => `<span class="demo-tag">${t}</span>`).join('')}</div>
          <h3>${v.title}</h3>
          <p>${v.desc}</p>
          <div class="demo-card-footer">
            <span class="demo-status"><span class="demo-status-dot"></span>${d.status_live}</span>
            <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener noreferrer" class="demo-yt-link" onclick="event.stopPropagation()">
              <i class="fab fa-youtube"></i> ${d.watch_yt}
            </a>
          </div>
        </div>
      </article>`;
  }

  function renderDemos() {
    const d = demosTrans[lang];
    document.title = d.page_title;
    document.getElementById('languageFlag').textContent = lang === 'es' ? '🇺🇸' : '🇪🇸';
    document.getElementById('languageText').textContent = lang === 'es' ? 'English' : 'Español';
    document.getElementById('footerText').textContent = d.footer;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      if (d[k]) el.textContent = d[k];
    });
    document.getElementById('lbYtText').textContent = d.watch_yt;

    document.getElementById('mainContent').innerHTML = `
      <aside class="archive-strip" role="note">
        <i class="fas fa-box-archive archive-strip-icon" aria-hidden="true"></i>
        <div class="archive-strip-body">
          <strong class="archive-strip-title">${d.archive_title}</strong>
          <p>${d.archive_text} <a href="https://www.raulpivet.com/pivettrack.html">${d.archive_link}</a></p>
        </div>
      </aside>

      <section class="demos-hero" data-aos="fade-down">
        <h1>${d.h1a}<br><span>${d.h1b}</span></h1>
        <p class="demos-hero-sub">${d.hero_sub}</p>
        <div class="demos-hero-tags">${d.hero_tags.map(t => `<span class="demos-hero-tag">${t}</span>`).join('')}</div>
      </section>

      <div class="demos-section-header" data-aos="fade-up">
        <p class="section-eyebrow">${d.videos_eyebrow}</p>
        <h2 class="section-title">${d.videos_title}</h2>
      </div>

      <div class="demos-grid">${d.videos.map((v, i) => buildVideoCard(v, d, i)).join('')}</div>`;

    if (typeof refreshAOS === 'function') refreshAOS();
    bindDemoCards();
  }

  function bindDemoCards() {
    document.querySelectorAll('.demo-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('.demo-yt-link')) return;
        const idx = parseInt(card.dataset.demoIdx);
        openDemoLightbox(idx);
      });
    });
  }

  // ══════════════════════════════════════════════════════
  // LIGHTBOX DEMOS (responsivo y dinámico)
  // ══════════════════════════════════════════════════════
  const demoLb = document.getElementById('demoLightbox');
  const lbOverlay = document.getElementById('lbOverlay');
  const lbClose = document.getElementById('lbClose');
  const lbTitle = document.getElementById('lbTitle');
  const lbDesc = document.getElementById('lbDesc');
  const lbYtBtn = document.getElementById('lbYtBtn');
  const lbInfoText = document.getElementById('lbInfoText');
  const lbReadMore = document.getElementById('lbReadMore');
  const lbSlideCounter = document.getElementById('lbSlideCounter');
  const carouselInner = document.getElementById('carouselInner');
  const carouselPrev = document.getElementById('carouselPrev');
  const carouselNext = document.getElementById('carouselNext');
  const carouselIndicators = document.getElementById('carouselIndicators');

  function openDemoLightbox(idx) {
    const d = demosTrans[lang];
    const demo = d.videos[idx];
    if (!demo) return;

    currentDemoData = demo;
    currentCarouselIndex = 0;

    // Construye lista de slides: primer el video principal, luego videos adicionales, luego imágenes
    const slides = [{ type: 'video', id: demo.id }];
    if (demo.extra_videos && demo.extra_videos.length > 0) {
      demo.extra_videos.forEach(vid_id => slides.push({ type: 'video', id: vid_id }));
    }
    if (demo.screenshots && demo.screenshots.length > 0) {
      demo.screenshots.forEach(url => slides.push({ type: 'image', url }));
    }
    currentSlidesCount = slides.length;

    // Renderiza slides con clase diferenciada (video vs image)
    carouselInner.innerHTML = slides.map((slide, i) => {
      if (slide.type === 'video') {
        return `
          <div class="lb-carousel-slide lb-carousel-slide--video" data-type="video">
            <div class="lb-video-holder">
              <iframe src="https://www.youtube.com/embed/${slide.id}?rel=0&modestbranding=1&autoplay=0" title="${demo.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
          </div>`;
      } else {
        return `
          <div class="lb-carousel-slide lb-carousel-slide--image" data-type="image">
            <img src="${slide.url}" alt="Screenshot ${i}" loading="lazy" draggable="false">
          </div>`;
      }
    }).join('');

    // Indicadores (dots)
    carouselIndicators.innerHTML = slides.map((_, i) =>
      `<button class="lb-carousel-dot ${i === 0 ? 'active' : ''}" data-slide="${i}" aria-label="Ir al slide ${i+1}"></button>`
    ).join('');
    document.querySelectorAll('.lb-carousel-dot').forEach(dot => {
      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        goToSlide(parseInt(dot.dataset.slide));
      });
    });

    // Título, descripción, link de YouTube
    lbTitle.textContent = demo.title;
    lbDesc.textContent = demo.desc_long || demo.desc;
    lbYtBtn.href = `https://www.youtube.com/watch?v=${demo.id}`;

    // Reset estado "leer más" (empieza colapsado en mobile)
    lbInfoText.classList.remove('expanded');
    lbInfoText.classList.add('collapsed');
    lbReadMore.textContent = d.read_more;

    // Solo mostrar botón "leer más" si el texto realmente es largo
    // (en desktop el CSS ya lo oculta, pero por si acaso)
    updateReadMoreVisibility();

    // Abrir modal
    demoLb.style.display = 'flex';
    requestAnimationFrame(() => requestAnimationFrame(() => demoLb.classList.add('lb-open')));
    document.body.style.overflow = 'hidden';

    updateCarouselUI();
  }

  function updateReadMoreVisibility() {
    // En desktop (>640px) el CSS oculta el botón. En mobile siempre visible.
    // Pero si el texto es corto y no se trunca, tampoco tiene sentido mostrarlo.
    // Usamos timeout para que el DOM se pinte antes de medir.
    setTimeout(() => {
      const p = lbDesc;
      if (!p) return;
      const isTruncated = p.scrollHeight > p.clientHeight + 2;
      lbReadMore.style.display = isTruncated ? '' : 'none';
    }, 50);
  }

  function closeDemoLightbox() {
    demoLb.classList.remove('lb-open');
    document.body.style.overflow = '';
    setTimeout(() => {
      demoLb.style.display = 'none';
      // Limpiar iframe para detener cualquier video que siga reproduciendo
      carouselInner.innerHTML = '';
    }, 380);
  }

  function goToSlide(index) {
    if (index < 0 || index >= currentSlidesCount) return;
    currentCarouselIndex = index;
    carouselInner.style.transform = `translateX(-${index * 100}%)`;
    updateCarouselUI();
  }

  function updateCarouselUI() {
    // Contador
    lbSlideCounter.textContent = `${currentCarouselIndex + 1} / ${currentSlidesCount}`;
    lbSlideCounter.style.display = currentSlidesCount > 1 ? '' : 'none';

    // Dots activos
    document.querySelectorAll('.lb-carousel-dot').forEach((dot, i) => {
      dot.classList.toggle('active', i === currentCarouselIndex);
    });

    // Flechas enabled/disabled
    carouselPrev.disabled = currentCarouselIndex === 0;
    carouselNext.disabled = currentCarouselIndex === currentSlidesCount - 1;

    // Ocultar flechas e indicadores si solo hay 1 slide
    const showControls = currentSlidesCount > 1;
    carouselPrev.style.display = showControls ? '' : 'none';
    carouselNext.style.display = showControls ? '' : 'none';
    carouselIndicators.style.display = showControls ? '' : 'none';
  }

  // Event listeners - cierre
  lbClose.addEventListener('click', (e) => { e.stopPropagation(); closeDemoLightbox(); });
  lbOverlay.addEventListener('click', closeDemoLightbox);

  // Event listeners - navegación
  carouselPrev.addEventListener('click', (e) => {
    e.stopPropagation();
    if (currentCarouselIndex > 0) goToSlide(currentCarouselIndex - 1);
  });
  carouselNext.addEventListener('click', (e) => {
    e.stopPropagation();
    if (currentCarouselIndex < currentSlidesCount - 1) goToSlide(currentCarouselIndex + 1);
  });

  // "Leer más"
  lbReadMore.addEventListener('click', (e) => {
    e.stopPropagation();
    const d = demosTrans[lang];
    const isExpanded = lbInfoText.classList.contains('expanded');
    if (isExpanded) {
      lbInfoText.classList.remove('expanded');
      lbInfoText.classList.add('collapsed');
      lbReadMore.textContent = d.read_more;
    } else {
      lbInfoText.classList.remove('collapsed');
      lbInfoText.classList.add('expanded');
      lbReadMore.textContent = d.read_less;
    }
  });

  // Teclado
  document.addEventListener('keydown', e => {
    if (demoLb.classList.contains('lb-open')) {
      if (e.key === 'Escape') closeDemoLightbox();
      if (e.key === 'ArrowLeft' && currentCarouselIndex > 0) goToSlide(currentCarouselIndex - 1);
      if (e.key === 'ArrowRight' && currentCarouselIndex < currentSlidesCount - 1) goToSlide(currentCarouselIndex + 1);
    }
  });

  // Swipe táctil (mobile) — solo si el touch empieza fuera del iframe del video
  let touchStartX = 0;
  let touchStartY = 0;
  let touchTarget = null;
  carouselInner.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
    touchTarget = e.target;
  }, { passive: true });

  carouselInner.addEventListener('touchend', e => {
    // No interferir con el iframe del video (YouTube maneja su propio swipe)
    if (touchTarget && touchTarget.tagName === 'IFRAME') return;
    const diffX = touchStartX - e.changedTouches[0].clientX;
    const diffY = touchStartY - e.changedTouches[0].clientY;
    // Solo cambiar slide si el gesto fue predominantemente horizontal
    if (Math.abs(diffX) < 50 || Math.abs(diffY) > Math.abs(diffX)) return;
    if (diffX > 0 && currentCarouselIndex < currentSlidesCount - 1) {
      goToSlide(currentCarouselIndex + 1);
    } else if (diffX < 0 && currentCarouselIndex > 0) {
      goToSlide(currentCarouselIndex - 1);
    }
  });

  // Recalcular "leer más" al cambiar tamaño de ventana
  let resizeTimer;
  window.addEventListener('resize', () => {
    if (!demoLb.classList.contains('lb-open')) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(updateReadMoreVisibility, 150);
  });

  function toggleLang() {
    lang = lang === 'es' ? 'en' : 'es';
    document.documentElement.lang = lang;
    localStorage.setItem('homeLang', lang);
    renderDemos();
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.documentElement.lang = lang;
    renderDemos();
    document.getElementById('languageToggle').addEventListener('click', toggleLang);
  });
  </script>
</body>
</html>
